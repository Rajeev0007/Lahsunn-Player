<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Loru Player">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#e9d5ff"/>
      <stop offset=".28"  stop-color="#a855f7"/>
      <stop offset=".52"  stop-color="#f3e8ff"/>
      <stop offset=".74"  stop-color="#7c3aed"/>
      <stop offset="1"    stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="chromeSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#f5f3ff"/>
      <stop offset=".45" stop-color="#c084fc"/>
      <stop offset="1"   stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#c084fc"/>
      <stop offset=".5"  stop-color="#f5f3ff"/>
      <stop offset="1"   stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- orbital ring, behind the letterform -->
  <g transform="rotate(-17 60 68)">
    <ellipse cx="60" cy="68" rx="52" ry="17" fill="none" stroke="url(#ringGrad)" stroke-width="5.5" opacity=".95"/>
    <ellipse cx="60" cy="68" rx="52" ry="17" fill="none" stroke="#2e1065" stroke-width="1.1" opacity=".5"/>
  </g>

  <!-- the L -->
  <g>
    <path d="M30 14 L50 20 L50 78 L84 78 L92 92 L34 92 Q30 92 30 88 Z"
          fill="url(#chrome)" stroke="#2e1065" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M33.5 18.5 L46.5 22.5 L46.5 74 L40 74 L40 26 Z" fill="url(#sheen)"/>
  </g>

  <!-- music note, tucked into the L's shoulder -->
  <g>
    <path d="M70 24 Q86 28 92 40 Q94 46 90 52 Q92 40 78 34 L78 66 L70 66 Z"
          fill="url(#chromeSoft)" stroke="#2e1065" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="66" cy="70" rx="12" ry="9" transform="rotate(-18 66 70)"
             fill="url(#chromeSoft)" stroke="#2e1065" stroke-width="2"/>
    <ellipse cx="62" cy="66" rx="5" ry="3.4" transform="rotate(-18 62 66)" fill="#ffffff" opacity=".45"/>
  </g>

  <!-- sparkles -->
  <path d="M58 26 L60.4 33 L67 35.4 L60.4 37.8 L58 45 L55.6 37.8 L49 35.4 L55.6 33 Z" fill="#e9d5ff" opacity=".95"/>
  <path d="M101 74 L102.6 79 L107.5 80.6 L102.6 82.2 L101 87 L99.4 82.2 L94.5 80.6 L99.4 79 Z" fill="#ddd6fe" opacity=".8"/>
</svg>
