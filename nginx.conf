server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Hash-based routing means any unknown path can fall back to the shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service workers must not be cached, or users get stuck on an old build
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Code fresh, images cached: mismatched CSS and JS versions break the UI
    location ^~ /src/ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location ^~ /assets/img/ {
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js;
        application/manifest+json             webmanifest;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/webp                            webp;
        image/x-icon                          ico;
        font/woff2                            woff2;
    }

    gzip              on;
    gzip_min_length   512;
    gzip_types        text/css application/javascript image/svg+xml application/manifest+json;
}
