# Render blueprint — deploys the whole player (UI + API + yt-dlp) as a container.
# Render dashboard -> New -> Blueprint -> point at this repo.
services:
  - type: web
    name: lahsunn-player
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Optional: Spotify playlist import (client credentials)
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # Optional: Last.fm playlist import
      - key: LASTFM_API_KEY
        sync: false
