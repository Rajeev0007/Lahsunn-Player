<!doctype html>
<html lang="en" data-theme="purple">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0715" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Lahsunn Player — a private, self-hosted web music player with live synced lyrics. Made by Rajeev." />

    <title>Lahsunn Player</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

      html { background: #0c0715; }
      html[data-theme="light"], html[data-theme="white"] { background: #f7f3fd; }
    </style>
  </head>

    <div id="root"></div>
