<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Loru Player">
  <!--
    Small-size variant of the Loru mark. The detailed logo (logo-mark.svg)
    collapses into mush below ~48px, so this drops the orbital ring and
    sparkles, thickens the strokes and sits on a solid tile for contrast.
    Used for the favicon, sidebar brand and app icons.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#a855f7"/>
      <stop offset=".55" stop-color="#7c3aed"/>
      <stop offset="1"   stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset=".65" stop-color="#f3e8ff"/>
      <stop offset="1"   stop-color="#e9d5ff"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="17" fill="url(#tile)"/>
  <rect x="1" y="1" width="62" height="62" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.6"/>

  <!-- L -->
  <path d="M19 15 L19 44 L45 44" fill="none" stroke="url(#glyph)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- note: head + stem, offset from the L's corner -->
  <path d="M41 19 L41 33" stroke="url(#glyph)" stroke-width="5" stroke-linecap="round"/>
  <path d="M41 19 Q49 20 50 26" fill="none" stroke="url(#glyph)" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="36.5" cy="34.5" r="5.6" fill="url(#glyph)"/>
</svg>
