<script>
/* Diagnostics: surfaces unexpected script errors instead of failing silently.
   Inspect window.__loruErrors in the console if something looks wrong. */
window.__loruErrors = [];
(function () {
  function record(message) {
    window.__loruErrors.push(message);
    document.documentElement.setAttribute('data-js-errors', window.__loruErrors.length);
    var node = document.getElementById('__diag');
    if (node) node.textContent = window.__loruErrors.join('\n');
  }
  window.addEventListener('error', function (e) {
    record((e.message || 'Script error') + ' @ ' + (e.filename || '?') + ':' + (e.lineno || 0));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
    record('Unhandled promise rejection: ' + reason);
  });
})();
</script>

<link rel="stylesheet" href="assets/css/theme.css" />

<!-- ───────────────────────── Ambient background ───────────────────────── -->
<div class="ambient" aria-hidden="true">
  <span class="ambient__blob ambient__blob--1"></span>
  <span class="ambient__blob ambient__blob--2"></span>
  <span class="ambient__blob ambient__blob--3"></span>
  <span class="ambient__grain"></span>

<a class="skip-link" href="#main">Skip to content</a>

<!-- ───────────────────────── App shell ───────────────────────── -->
<div class="app" id="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sidebar__head">
      <a class="brand" href="#/home" data-nav>
        <!-- Uses assets/img/logo.png when present, otherwise the bundled SVG.
             Drop your own logo.png in and it appears here automatically. -->
        <img class="brand__mark" src="assets/img/logo.png" alt="" width="36" height="36"
             decoding="async" onerror="this.onerror=null;this.src='assets/img/logo.svg'" />
        <span class="brand__text">
          <strong>Loru</strong><span>Player</span>
        </span>
      </a>
      <button class="icon-btn sidebar__collapse" id="sidebarCollapse" aria-label="Collapse sidebar" title="Collapse sidebar">
        <svg class="icon"><use href="#i-chevron-left"/></svg>
      </button>
    </div>

    <nav class="nav" aria-label="Sections">
      <a class="nav__item" href="#/home" data-nav data-route="home" title="Home"><svg class="icon"><use href="#i-home"/></svg><span>Home</span></a>
      <a class="nav__item" href="#/search" data-nav data-route="search" title="Search"><svg class="icon"><use href="#i-search"/></svg><span>Search</span></a>
      <a class="nav__item" href="#/library" data-nav data-route="library" title="Your Library"><svg class="icon"><use href="#i-library"/></svg><span>Your Library</span></a>
      <a class="nav__item" href="#/sources" data-nav data-route="sources" title="Link Sources"><svg class="icon"><use href="#i-link"/></svg><span>Link Sources</span><span class="nav__dot" id="navSourcesDot" hidden></span></a>
    </nav>

    <div class="sidebar__section">
      <div class="sidebar__label">
        <span>Playlists</span>
        <button class="icon-btn icon-btn--sm" id="btnNewPlaylist" aria-label="Create playlist" title="Create playlist">
          <svg class="icon"><use href="#i-plus"/></svg>
        </button>
      </div>
      <div class="playlist-list" id="sidebarPlaylists"></div>
    </div>

    <div class="sidebar__foot">
      <a class="nav__item nav__item--quiet" href="#/settings" data-nav data-route="settings" title="Settings"><svg class="icon"><use href="#i-settings"/></svg><span>Settings</span></a>
      <button class="nav__item nav__item--quiet" id="btnShortcuts" title="Keyboard shortcuts"><svg class="icon"><use href="#i-info"/></svg><span>Shortcuts</span></button>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

  <!-- Main -->
  <main class="main" id="main">
    <header class="topbar" id="topbar">
      <div class="topbar__left">
        <button class="icon-btn topbar__menu" id="btnMenu" aria-label="Open menu">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div class="history-btns">
          <button class="icon-btn" id="btnBack" aria-label="Go back"><svg class="icon"><use href="#i-chevron-left"/></svg></button>
          <button class="icon-btn" id="btnForward" aria-label="Go forward"><svg class="icon"><use href="#i-chevron-right"/></svg></button>
        </div>
        <a class="brand brand--compact" href="#/home" data-nav aria-label="Loru Player home">
          <img class="brand__mark" src="assets/img/logo.png" alt="Loru Player" width="34" height="34"
               decoding="async" onerror="this.onerror=null;this.src='assets/img/logo.svg'" />
        </a>
      </div>

      <form class="searchbar" id="searchForm" role="search" autocomplete="off">
        <svg class="icon searchbar__icon"><use href="#i-search"/></svg>
        <input class="searchbar__input" id="searchInput" type="search" placeholder="Search songs, artists or paste a playlist link…" aria-label="Search music or paste a link" />
        <button class="searchbar__clear icon-btn icon-btn--sm" type="button" id="searchClear" aria-label="Clear search" hidden><svg class="icon"><use href="#i-close"/></svg></button>
        <kbd class="searchbar__kbd">/</kbd>
      </form>

      <div class="topbar__right">
        <button class="btn btn--ghost btn--icon-left topbar__link" id="btnQuickLink">
          <svg class="icon"><use href="#i-link"/></svg><span>Link playlist</span>
        </button>
        <button class="icon-btn" id="btnTheme" aria-label="Toggle theme" title="Toggle light / dark">
          <svg class="icon" id="themeIcon" viewBox="0 0 24 24"><path d="M12 4.5a7.5 7.5 0 1 0 7.5 7.5A5.6 5.6 0 0 1 12 4.5Z" fill="currentColor"/></svg>
        </button>
        <a class="avatar" href="#/settings" data-nav id="avatar" title="Your account">
          <span id="avatarInitial">L</span>
        </a>
      </div>
    </header>

    <div class="view-wrap" id="viewWrap">
      <!-- Views are rendered here -->
    </div>
  </main>

  <!-- Queue panel (desktop) -->
  <aside class="queue-panel" id="queuePanel" aria-label="Play queue" data-open="false">
    <div class="queue-panel__head">
      <div class="tabs" role="tablist">
        <button class="tabs__btn is-active" data-qtab="queue" role="tab">Queue</button>
        <button class="tabs__btn" data-qtab="nowplaying" role="tab">Now playing</button>
      </div>
      <button class="icon-btn" id="btnCloseQueue" aria-label="Close queue"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="queue-panel__body" id="queueBody"></div>
  </aside>
</div>

<!-- ───────────────────────── Player bar ───────────────────────── -->
<footer class="playerbar" id="playerbar" data-has-track="false" aria-label="Player controls">
  <div class="playerbar__progress-mobile" id="mobileProgress" aria-hidden="true"><span id="mobileProgressFill"></span></div>

  <div class="playerbar__track" id="pbTrack" role="button" tabindex="0" aria-label="Open now playing">
    <div class="art art--sm" id="pbArt">
      <img alt="" id="pbArtImg" />
      <span class="art__placeholder"><svg class="icon"><use href="#i-wave"/></svg></span>
      <span class="art__eq" id="pbArtEq" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
    <div class="playerbar__meta">
      <div class="playerbar__title" id="pbTitle">Nothing playing</div>
      <div class="playerbar__artist" id="pbArtist">Pick a track to get started</div>
    </div>
    <button class="icon-btn icon-btn--like playerbar__like" id="pbLike" aria-label="Save to Liked Songs">
      <svg class="icon"><use href="#i-heart"/></svg>
    </button>
  </div>

  <div class="playerbar__center">
    <div class="controls">
      <button class="icon-btn controls__side" id="btnShuffle" aria-label="Shuffle" title="Shuffle (S)"><svg class="icon"><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn" id="btnPrev" aria-label="Previous track" title="Previous"><svg class="icon"><use href="#i-prev"/></svg></button>
      <button class="play-btn" id="btnPlay" aria-label="Play" title="Play / pause (Space)">
        <svg class="icon" id="playIcon"><use href="#i-play"/></svg>
        <span class="play-btn__spinner" id="playSpinner" hidden></span>
      </button>
      <button class="icon-btn" id="btnNext" aria-label="Next track" title="Next"><svg class="icon"><use href="#i-next"/></svg></button>
      <button class="icon-btn controls__side" id="btnRepeat" aria-label="Repeat" title="Repeat (R)"><svg class="icon" id="repeatIcon"><use href="#i-repeat"/></svg></button>
    </div>
    <div class="seek">
      <span class="seek__time" id="seekCurrent">0:00</span>
      <div class="slider" id="seekSlider" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="slider__track"><div class="slider__fill" id="seekFill"></div><div class="slider__thumb" id="seekThumb"></div></div>
      </div>
      <span class="seek__time" id="seekDuration">0:00</span>
    </div>
  </div>

  <div class="playerbar__right">
    <span class="source-badge" id="pbSource" hidden></span>
    <button class="icon-btn" id="btnQueue" aria-label="Open queue" title="Queue (Q)"><svg class="icon"><use href="#i-queue"/></svg></button>
    <div class="volume">
      <button class="icon-btn" id="btnMute" aria-label="Mute" title="Mute (M)"><svg class="icon" id="volIcon"><use href="#i-volume"/></svg></button>
      <div class="slider slider--vol" id="volSlider" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
        <div class="slider__track"><div class="slider__fill" id="volFill"></div><div class="slider__thumb" id="volThumb"></div></div>
      </div>
    </div>
    <button class="icon-btn" id="btnExpand" aria-label="Full screen player" title="Full screen"><svg class="icon"><use href="#i-expand"/></svg></button>
  </div>
</footer>

<!-- ───────────────────────── Mobile bottom nav ───────────────────────── -->
<nav class="tabbar" id="tabbar" aria-label="Mobile navigation">
  <a class="tabbar__item" href="#/home" data-nav data-route="home"><svg class="icon"><use href="#i-home"/></svg><span>Home</span></a>
  <a class="tabbar__item" href="#/search" data-nav data-route="search"><svg class="icon"><use href="#i-search"/></svg><span>Search</span></a>
  <a class="tabbar__item" href="#/library" data-nav data-route="library"><svg class="icon"><use href="#i-library"/></svg><span>Library</span></a>
  <a class="tabbar__item" href="#/sources" data-nav data-route="sources"><svg class="icon"><use href="#i-link"/></svg><span>Link</span></a>
</nav>

<!-- ───────────────────────── Now playing sheet ───────────────────────── -->
<section class="np" id="npSheet" aria-hidden="true" aria-label="Now playing">
  <div class="np__bg" id="npBg"></div>
  <div class="np__inner">
    <header class="np__head">
      <button class="icon-btn" id="npClose" aria-label="Close full screen player"><svg class="icon"><use href="#i-chevron-down"/></svg></button>
      <div class="np__context">
        <small id="npContextLabel">Playing from</small>
        <strong id="npContextName">Loru</strong>
      </div>
      <button class="icon-btn" id="npQueueBtn" aria-label="Show queue"><svg class="icon"><use href="#i-queue"/></svg></button>
    </header>

    <div class="np__modes">
      <div class="tabs" role="tablist" aria-label="Now playing view">
        <button class="tabs__btn is-active" data-npmode="lyrics" role="tab">Lyrics</button>
        <button class="tabs__btn" data-npmode="art" role="tab">Artwork</button>
        <button class="tabs__btn" data-npmode="video" role="tab" hidden id="npModeVideo">Video</button>
      </div>
    </div>

    <div class="np__stage" id="npStage" data-mode="lyrics">
      <div class="np__art art">
        <img alt="" id="npArtImg" />
        <span class="art__placeholder"><svg class="icon"><use href="#i-wave"/></svg></span>
      </div>

      <div class="lyrics" id="npLyrics" aria-live="polite">
        <div class="lyrics__scroll" id="npLyricsScroll"></div>
      </div>

      <!-- Shown when the browser refuses to start playback without a tap -->
      <div class="gesture-gate" id="gestureGate" hidden>
        <button class="play-btn play-btn--lg" id="gestureBtn" type="button" aria-label="Start playback">
          <svg class="icon"><use href="#i-play"/></svg>
        </button>
        <div class="gesture-gate__text">
          <strong>Tap to start</strong>
          <span>Your browser blocks audio until you tap.</span>
        </div>
      </div>

      <canvas class="np__viz" id="npViz" width="600" height="120" aria-hidden="true"></canvas>
    </div>

    <div class="np__meta">
      <div class="np__titles">
        <h2 id="npTitle">Nothing playing</h2>
        <p id="npArtist">—</p>
      </div>
      <button class="icon-btn icon-btn--like icon-btn--lg" id="npLike" aria-label="Save to Liked Songs"><svg class="icon"><use href="#i-heart"/></svg></button>
    </div>

    <div class="np__seek seek">
      <span class="seek__time" id="npCurrent">0:00</span>
      <div class="slider" id="npSeekSlider" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="slider__track"><div class="slider__fill" id="npSeekFill"></div><div class="slider__thumb" id="npSeekThumb"></div></div>
      </div>
      <span class="seek__time" id="npDuration">0:00</span>
    </div>

    <div class="np__controls controls controls--lg">
      <button class="icon-btn" id="npShuffle" aria-label="Shuffle"><svg class="icon"><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn" id="npPrev" aria-label="Previous"><svg class="icon"><use href="#i-prev"/></svg></button>
      <button class="play-btn play-btn--lg" id="npPlay" aria-label="Play"><svg class="icon" id="npPlayIcon"><use href="#i-play"/></svg></button>
      <button class="icon-btn" id="npNext" aria-label="Next"><svg class="icon"><use href="#i-next"/></svg></button>
      <button class="icon-btn" id="npRepeat" aria-label="Repeat"><svg class="icon" id="npRepeatIcon"><use href="#i-repeat"/></svg></button>
    </div>

    <div class="np__foot">
      <span class="source-badge" id="npSource" hidden></span>
      <a class="np__origin" id="npOrigin" target="_blank" rel="noopener" hidden>Open original ↗</a>
    </div>
  </div>
</section>

<!-- YouTube playback surface (moves into the now-playing stage when active) -->
<div class="yt-host" id="ytHost" aria-hidden="true"><div id="ytPlayer"></div></div>

<!-- ───────────────────────── Modal + toast roots ───────────────────────── -->
<div class="modal-root" id="modalRoot" hidden></div>
<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>
<div class="ctx-root" id="ctxRoot" hidden></div>
<pre id="__diag" hidden aria-hidden="true"></pre>
